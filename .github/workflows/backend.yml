name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run auth:setup
      - run: npm run check
      - name: Install PostgreSQL 18
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-18
      - name: Initialize isolated CI databases
        run: |
          node database/scripts/db.mjs init
          node database/scripts/db.mjs setup
          node database/scripts/db.mjs seed
      - run: node database/scripts/db.mjs test
      - run: node scripts/verify-orm.mjs
      - run: npm run test:integration
      - run: node scripts/smoke.mjs
      - run: node scripts/identity-smoke.mjs
      - name: Stop project database
        if: always()
        run: node database/scripts/db.mjs stop
