name: Target engineering foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run api:generate
      - run: git diff --exit-code -- docs/specifications/openapi
      - run: npm run test:database
      - run: npm run test:docker
      - run: npm run security:scan
      - name: Stop test-owned engineering containers
        if: always()
        run: docker compose -f infrastructure/deployment/compose.yml down
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase-02-evidence
          path: |
            .local/phase-02-browser.json
            test-results
